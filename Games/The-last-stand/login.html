<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Last Stand - Live Login Test</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0}
    body{display:grid;place-items:center;padding:20px;color:#eefaff;background:radial-gradient(circle at 50% 30%,#1d3554,#080d18 70%);font-family:Inter,system-ui,sans-serif}
    .card{width:min(460px,100%);padding:30px;border:1px solid rgba(116,218,255,.55);border-radius:18px;background:rgba(7,17,29,.96);box-shadow:0 24px 80px #000,0 0 42px rgba(65,190,255,.16)}
    h1{margin:0 0 8px;text-align:center;letter-spacing:.08em} p{color:#bfd3df;line-height:1.5;text-align:center}
    label{display:block;margin:14px 0 6px;color:#9be8ff;font-size:12px;font-weight:900;letter-spacing:.1em}
    input{width:100%;padding:13px 14px;border:1px solid rgba(130,224,255,.45);border-radius:10px;color:#effbff;background:#0a1727;font:800 16px system-ui;outline:none}
    input:focus{border-color:#78ddff;box-shadow:0 0 18px rgba(80,205,255,.18)}
    button{width:100%;margin-top:18px;padding:14px;border:1px solid #78ddff;border-radius:11px;color:#fff;background:linear-gradient(#24759d,#0b3049);font:900 15px system-ui;letter-spacing:.12em;cursor:pointer}
    button:disabled{opacity:.55;cursor:default}.message{min-height:22px;margin-top:14px;text-align:center;color:#ffcf8a;font-weight:800}.result{display:none;margin-top:16px;padding:14px;border-radius:12px;background:#07111f;border:1px solid rgba(115,225,255,.25)}
    .result.show{display:block}.ok{color:#8fffc6}.bad{color:#ff9b8f}.row{display:flex;justify-content:space-between;gap:20px;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.06)}.row:last-child{border:0}.value{font-weight:900;text-align:right}
  </style>
</head>
<body>
  <main class="card">
    <h1>THE LAST STAND</h1>
    <p>A new callsign creates a player. An existing callsign requires the correct PIN.</p>
    <label for="username">CALLSIGN</label>
    <input id="username" maxlength="24" autocomplete="username" placeholder="test_player">
    <label for="pin">4-DIGIT PIN</label>
    <input id="pin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" placeholder="1234">
    <button id="join" type="button">JOIN THE WAR</button>
    <div id="message" class="message"></div>
    <section id="result" class="result"></section>
  </main>
<script>
  "use strict";
  const usernameInput=document.getElementById("username");
  const pinInput=document.getElementById("pin");
  const joinButton=document.getElementById("join");
  const message=document.getElementById("message");
  const result=document.getElementById("result");

  async function joinWar(){
    const username=usernameInput.value.trim().toLowerCase();
    const pin=pinInput.value.trim();
    result.className="result";
    result.innerHTML="";
    if(!/^[a-z0-9_]{3,24}$/.test(username)){
      message.textContent="Callsign must be 3-24 letters, numbers, or underscores.";
      return;
    }
    if(!/^\d{4}$/.test(pin)){
      message.textContent="PIN must be exactly 4 digits.";
      return;
    }
    joinButton.disabled=true;
    joinButton.textContent="CONTACTING COMMAND...";
    message.textContent="";
    try{
      const response=await fetch("/api/players/login",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({username,pin})
      });
      const payload=await response.json().catch(()=>({error:"Server did not return JSON."}));
      if(!response.ok) throw new Error(payload.error||`Request failed with status ${response.status}.`);
      const player=payload.player||{};
      sessionStorage.setItem("lastStandUsername",player.username||username);
      message.innerHTML=`<span class="ok">${payload.created?"PLAYER CREATED":"LOGIN SUCCESSFUL"}</span>`;
      result.innerHTML=`
        <div class="row"><span>Callsign</span><span class="value">${escapeHtml(player.username)}</span></div>
        <div class="row"><span>Player ID</span><span class="value">${escapeHtml(String(player.id??""))}</span></div>
        <div class="row"><span>Class</span><span class="value">${escapeHtml(player.class||"Not selected")}</span></div>
        <div class="row"><span>Energy</span><span class="value">${escapeHtml(String(player.energy??""))} / 5</span></div>
        <div class="row"><span>Last energy time</span><span class="value">${escapeHtml(String(player.last_energy_at||""))}</span></div>`;
      result.classList.add("show");
    }catch(error){
      message.innerHTML=`<span class="bad">${escapeHtml(error.message||"Unable to reach the server.")}</span>`;
    }finally{
      joinButton.disabled=false;
      joinButton.textContent="JOIN THE WAR";
    }
  }
  function escapeHtml(value){return value.replace(/[&<>'"]/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"})[char]);}
  joinButton.addEventListener("click",joinWar);
  pinInput.addEventListener("keydown",event=>{if(event.key==="Enter")joinWar();});
  usernameInput.value=sessionStorage.getItem("lastStandUsername")||"";
</script>
</body>
</html>
